# CI for churro-coder. Each app builds + tests on its own runner so that a slow
# desktop suite doesn't queue up Go / .NET feedback (and vice versa), and the
# desktop Vitest run doesn't have to fight gateway / daemon / landing for CPU
# and memory on a single ubuntu-latest box.
#
# The required check ("CI / Build & check") is the final `ci-success`
# aggregator that depends on every per-app job — that name is preserved so
# existing branch-protection rulesets keep matching without a UI change.

name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

# Cancel superseded PR runs; let main pushes finish so we don't lose signal.
# Concurrency group is workflow-wide, so all four parallel app jobs (and the
# aggregator) get canceled together on a new push to the same PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (bun + Electron)
    # `pull_request.types` now includes `edited` so the pr-title job can
    # re-lint a fixed title, but that also re-triggers this entire workflow
    # on pure title/body edits with no code change. Skip the actual build —
    # only pr-title needs to run for an edited-only event.
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # pnpm version is read from the root package.json `packageManager` field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/bun.lock', 'apps/landing/bun.lock', 'apps/gateway/Gateway.csproj', 'apps/daemon/go.mod') }}
          restore-keys: |
            nx-${{ runner.os }}-

      # apps/desktop is bun-managed (intentionally outside the pnpm workspace).
      # Cache its node_modules separately keyed on bun.lock so reinstalls only
      # happen when deps actually change. The postinstall runs electron-rebuild
      # which compiles better-sqlite3 / node-pty natively — that's the slow bit.
      - name: Cache desktop node_modules
        id: cache-desktop
        uses: actions/cache@v4
        with:
          path: apps/desktop/node_modules
          key: bun-desktop-${{ runner.os }}-${{ hashFiles('apps/desktop/bun.lock') }}

      - name: Install root deps (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Install desktop deps (bun)
        if: steps.cache-desktop.outputs.cache-hit != 'true'
        working-directory: apps/desktop
        env:
          SKIP_ELECTRON_REBUILD: "1"
        run: bun install --frozen-lockfile

      - name: Build desktop
        run: pnpm exec nx run desktop:build

      # desktop intentionally has no `lint` target — see apps/desktop/AGENTS.md
      # and project.json. Don't add one here without coordinating that file too.
      - name: Test desktop
        run: pnpm exec nx run desktop:test

  gateway:
    name: Gateway (.NET 10)
    # Skip on title/body-only edits — see desktop job's comment above.
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/bun.lock', 'apps/landing/bun.lock', 'apps/gateway/Gateway.csproj', 'apps/daemon/go.mod') }}
          restore-keys: |
            nx-${{ runner.os }}-

      - name: Install root deps (pnpm)
        run: pnpm install --frozen-lockfile

      # @nx/dotnet infers a separate `Gateway.Tests` project from the test
      # csproj — restore / build / test all need to cover both projects.
      - name: Restore .NET deps (gateway + Gateway.Tests)
        run: pnpm exec nx run-many -t restore --projects=gateway,Gateway.Tests

      - name: Build .NET (gateway + Gateway.Tests)
        run: pnpm exec nx run-many -t build --projects=gateway,Gateway.Tests

      - name: Test gateway (Gateway.Tests)
        run: pnpm exec nx run Gateway.Tests:test

  daemon:
    name: Daemon (Go)
    # Skip on title/body-only edits — see desktop job's comment above.
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/daemon/go.mod
          cache: false # daemon has no go.sum yet; setup-go cache would warn

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/bun.lock', 'apps/landing/bun.lock', 'apps/gateway/Gateway.csproj', 'apps/daemon/go.mod') }}
          restore-keys: |
            nx-${{ runner.os }}-

      - name: Install root deps (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Build daemon
        run: pnpm exec nx run daemon:build

      - name: Lint daemon
        run: pnpm exec nx run daemon:lint

      - name: Test daemon
        run: pnpm exec nx run daemon:test

  landing:
    name: Landing (Next.js + Pillow)
    # Skip on title/body-only edits — see desktop job's comment above.
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: oven-sh/setup-bun@v2

      # apps/landing's prebuild runs scripts/process-assets.py which uses PIL
      # to crop/round desktop screenshots before `next build`. Mirrors the
      # python3-pil install in apps/landing/Dockerfile.
      - name: Install Pillow (for landing prebuild)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pil

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/desktop/bun.lock', 'apps/landing/bun.lock', 'apps/gateway/Gateway.csproj', 'apps/daemon/go.mod') }}
          restore-keys: |
            nx-${{ runner.os }}-

      # apps/landing is bun-managed too (also outside the pnpm workspace).
      - name: Cache landing node_modules
        id: cache-landing
        uses: actions/cache@v4
        with:
          path: apps/landing/node_modules
          key: bun-landing-${{ runner.os }}-${{ hashFiles('apps/landing/bun.lock') }}

      - name: Install root deps (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Install landing deps (bun)
        if: steps.cache-landing.outputs.cache-hit != 'true'
        working-directory: apps/landing
        run: bun install --frozen-lockfile

      - name: Build landing
        run: pnpm exec nx run landing:build

      - name: Lint landing
        run: pnpm exec nx run landing:lint

  # release-please parses commit subjects for Conventional Commits types
  # (feat:, fix:, chore:, ...); with squash_merge_commit_title:
  # COMMIT_OR_PR_TITLE, the PR title *is* that subject. A non-conventional
  # title is silently unparseable — release-please just finds 0 releasable
  # commits and skips cutting a release, with no error anywhere. Lint the
  # title so that failure mode becomes a blocking CI check instead.
  pr-title:
    name: PR title (Conventional Commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read

    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            perf
            test
            build
            ci
            revert

  # Single required check for branch-protection. The name "Build & check"
  # matches the existing ruleset context exactly, so the merge gate keeps
  # working without a GitHub UI change.
  #
  # NOTE: every dep can legitimately be 'skipped', not just 'success':
  # desktop/gateway/daemon/landing skip themselves on title/body-only PR
  # edits (see their `if:` conditions above), and pr-title skips itself on
  # push-to-main (no PR title to lint there). 'failure'/'cancelled' still
  # fail this check either way.
  ci-success:
    name: Build & check
    needs: [desktop, gateway, daemon, landing, pr-title]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Verify all required jobs passed
        run: |
          for r in "${{ needs.desktop.result }}" \
                   "${{ needs.gateway.result }}" \
                   "${{ needs.daemon.result }}" \
                   "${{ needs.landing.result }}" \
                   "${{ needs.pr-title.result }}"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::Required CI job did not succeed (result=$r)"
              exit 1
            fi
          done
